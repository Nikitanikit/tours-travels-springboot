<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Destinations | Tours & Travels</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><div th:replace="~{fragments :: nav}"></div><section class="page-hero destination-hero"><div class="page-hero-content"><span class="eyebrow">EXPLORE THE WORLD</span><h1>Places that stay<br><em>with you.</em></h1><p>Find the landscapes, cultures and little discoveries you'll remember long after you return.</p></div></section><main class="section"><div th:replace="~{fragments :: alerts}"></div><div class="section-heading"><div><span class="eyebrow">THE DESTINATION COLLECTION</span><h2>Find your <em>somewhere.</em></h2></div><form class="inline-search" th:action="@{/destinations}" method="get"><input name="q" th:value="${q}" placeholder="Search places or countries"><button class="btn btn-primary">Search</button></form></div><div class="destination-grid destination-grid-large"><a class="destination-card" th:each="d : ${destinations}" th:href="@{/destinations/{id}(id=${d.id})}"><img th:src="${d.imageUrl}" th:alt="${d.name}" loading="lazy"><div class="image-gradient"></div><div class="destination-info"><span th:text="${d.country}">Country</span><h3 th:text="${d.name}">Destination</h3><p th:text="${d.description}">Description</p><b>Discover destination ↗</b></div></a></div><div class="empty-state" th:if="${#lists.isEmpty(destinations)}">No destinations matched your search.</div></main><div th:replace="~{fragments :: footer}"></div></body></html>
