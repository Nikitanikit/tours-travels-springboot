<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Add Hotel</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><div th:replace="~{fragments :: nav}"></div><main class="section form-page"><span class="eyebrow">ADMIN / STAYS</span><h1>Add a <em>hotel.</em></h1><form th:action="@{/admin/hotels/save}" th:object="${hotel}" method="post" class="form-stack form-card"><label>Name<input th:field="*{name}" required></label><label>Location<input th:field="*{location}" required></label><label>Image URL<input th:field="*{imageUrl}" required placeholder="https://..."></label><label>Description<textarea th:field="*{description}" rows="4"></textarea></label><label>Price per night (INR)<input th:field="*{pricePerNight}" type="number" min="0" step="0.01" required></label><label>Hotel type<input th:field="*{hotelType}" required></label><label>Rating<input th:field="*{rating}" type="number" min="0" max="5" step="0.1"></label><label class="check-label"><input th:field="*{active}" type="checkbox"> Active on website</label><button class="btn btn-gold">Save hotel ↗</button></form></main><div th:replace="~{fragments :: footer}"></div></body></html>
