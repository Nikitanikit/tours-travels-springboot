<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Add Package</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><div th:replace="~{fragments :: nav}"></div><main class="section form-page"><span class="eyebrow">ADMIN / PACKAGES</span><h1>Add a <em>tour package.</em></h1><form th:action="@{/admin/packages/save}" th:object="${tourPackage}" method="post" class="form-stack form-card"><label>Package title<input th:field="*{title}" required></label><label>Destination<select name="destinationId"><option value="">Choose destination</option><option th:each="d : ${destinations}" th:value="${d.id}" th:text="${d.name}"></option></select></label><label>Image URL<input th:field="*{imageUrl}" required placeholder="https://..."></label><label>Description<textarea th:field="*{description}" rows="4"></textarea></label><label>Price per person (INR)<input th:field="*{price}" type="number" min="0" step="0.01" required></label><div class="two-fields"><label>Days<input th:field="*{durationDays}" type="number" min="1" required></label><label>Nights<input th:field="*{durationNights}" type="number" min="0" required></label></div><label>Category<input th:field="*{category}" required></label><label>Rating<input th:field="*{rating}" type="number" min="0" max="5" step="0.1"></label><label class="check-label"><input th:field="*{featured}" type="checkbox"> Featured package</label><label class="check-label"><input th:field="*{active}" type="checkbox"> Active on website</label><button class="btn btn-gold">Save package ↗</button></form></main><div th:replace="~{fragments :: footer}"></div></body></html>
