<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Add Destination</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><div th:replace="~{fragments :: nav}"></div><main class="section form-page"><span class="eyebrow">ADMIN / DESTINATIONS</span><h1>Add a <em>destination.</em></h1><form th:action="@{/admin/destinations/save}" th:object="${destination}" method="post" class="form-stack form-card"><label>Name<input th:field="*{name}" required></label><label>Country<input th:field="*{country}" required></label><label>Category<input th:field="*{category}" required></label><label>Image URL<input th:field="*{imageUrl}" required placeholder="https://..."></label><label>Description<textarea th:field="*{description}" rows="4"></textarea></label><label>Rating<input th:field="*{rating}" type="number" min="0" max="5" step="0.1"></label><label class="check-label"><input th:field="*{featured}" type="checkbox"> Featured destination</label><label class="check-label"><input th:field="*{active}" type="checkbox"> Active on website</label><button class="btn btn-gold">Save destination ↗</button></form></main><div th:replace="~{fragments :: footer}"></div></body></html>
