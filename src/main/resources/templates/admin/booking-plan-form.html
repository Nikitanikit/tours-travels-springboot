<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Travel Plan</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body class="admin-body"><aside class="admin-sidebar"><a class="brand brand-light" th:href="@{/}"><span class="brand-mark">⌁</span><span>Tours <b>&</b> Travels</span></a><p class="sidebar-caption">ADMIN WORKSPACE</p><a class="admin-link" th:href="@{/admin}">▦ Dashboard</a><a class="admin-link active" th:href="@{/admin/requests}">⌖ Booking requests</a></aside><main class="admin-main"><header class="admin-top"><div><span class="eyebrow">PLAN CREATION</span><h1>Prepare the travel plan for <em th:text="${booking.displayName}">Trip</em>.</h1></div></header><div th:replace="~{fragments :: alerts}"></div><form class="admin-form" th:action="@{/admin/bookings/{id}/plan(id=${booking.id})}" method="post"><div class="form-grid"><div><label>Travel date</label><input type="date" name="travelDate" th:value="${booking.travelDate}" required></div><div><label>Travel time</label><input type="time" name="travelTime" th:value="${booking.travelTime}" required></div><div class="full-width"><label>Pickup location</label><input type="text" name="pickupLocation" th:value="${booking.pickupLocation}" placeholder="Hotel / airport / city center" required></div><div class="full-width"><label>Places to visit</label><input type="text" name="travelPlaces" th:value="${booking.travelPlaces}" placeholder="Agra, Jaipur, Delhi" required></div><div class="full-width"><label>Travel plan</label><textarea name="travelPlan" rows="8" th:text="${booking.travelPlan}" placeholder="Write the complete itinerary with timing, stays, transfers and highlights" required></textarea></div><div><label>Amount due</label><input type="number" name="amountDue" min="0" step="1" th:value="${booking.amountDue}" required></div><div class="full-width"><label>Admin notes</label><textarea name="adminNotes" rows="4" th:text="${booking.adminNotes}" placeholder="Internal notes for the trip and payment status"></textarea></div></div><div class="form-actions"><a class="btn btn-outline" th:href="@{/admin/requests}">Cancel</a><button class="btn btn-gold" type="submit">Send plan to user</button></div></form></main></body></html>
