<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Manage Hotels</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><div th:replace="~{fragments :: nav}"></div><main class="section admin-content"><div th:replace="~{fragments :: alerts}"></div><div class="section-heading"><div><span class="eyebrow">ADMIN / STAYS</span><h1>Manage <em>hotels.</em></h1></div><a class="btn btn-gold" th:href="@{/admin/hotels/new}">+ Add hotel</a></div><div class="table-wrap"><table><thead><tr><th>Name</th><th>Location</th><th>Type</th><th>Price/night</th><th>Actions</th></tr></thead><tbody><tr th:each="h : ${hotels}"><td th:text="${h.name}">Hotel</td><td th:text="${h.location}">Location</td><td th:text="${h.hotelType}">Type</td><td th:text="${'₹' + #numbers.formatDecimal(h.pricePerNight,1,'COMMA',0,'POINT')}">₹0</td><td><form th:action="@{/admin/hotels/{id}/delete(id=${h.id})}" method="post" onsubmit="return confirm('Delete this hotel?')"><button class="btn btn-outline btn-small">Delete</button></form></td></tr></tbody></table></div></main><div th:replace="~{fragments :: footer}"></div></body></html>
