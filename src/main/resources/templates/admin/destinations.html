<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Manage Destinations</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><div th:replace="~{fragments :: nav}"></div><main class="section admin-content"><div th:replace="~{fragments :: alerts}"></div><div class="section-heading"><div><span class="eyebrow">ADMIN / DESTINATIONS</span><h1>Manage <em>destinations.</em></h1></div><a class="btn btn-gold" th:href="@{/admin/destinations/new}">+ Add destination</a></div><div class="table-wrap"><table><thead><tr><th>Image</th><th>Name</th><th>Country</th><th>Category</th><th>Actions</th></tr></thead><tbody><tr th:each="d : ${destinations}"><td><img class="table-thumb" th:src="${d.imageUrl}" alt=""></td><td th:text="${d.name}">Name</td><td th:text="${d.country}">Country</td><td th:text="${d.category}">Category</td><td><form th:action="@{/admin/destinations/{id}/delete(id=${d.id})}" method="post" onsubmit="return confirm('Delete this destination?')"><button class="btn btn-outline btn-small">Delete</button></form></td></tr></tbody></table></div></main><div th:replace="~{fragments :: footer}"></div></body></html>
