<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Manage Packages</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><div th:replace="~{fragments :: nav}"></div><main class="section admin-content"><div th:replace="~{fragments :: alerts}"></div><div class="section-heading"><div><span class="eyebrow">ADMIN / PACKAGES</span><h1>Manage <em>tour packages.</em></h1></div><a class="btn btn-gold" th:href="@{/admin/packages/new}">+ Add package</a></div><div class="table-wrap"><table><thead><tr><th>Package</th><th>Destination</th><th>Duration</th><th>Price</th><th>Actions</th></tr></thead><tbody><tr th:each="p : ${packages}"><td th:text="${p.title}">Package</td><td th:text="${p.destination != null ? p.destination.name : '-'}">Destination</td><td th:text="${p.durationDays} + ' days'">Days</td><td th:text="${'₹' + #numbers.formatDecimal(p.price,1,'COMMA',0,'POINT')}">₹0</td><td><form th:action="@{/admin/packages/{id}/delete(id=${p.id})}" method="post" onsubmit="return confirm('Delete this package?')"><button class="btn btn-outline btn-small">Delete</button></form></td></tr></tbody></table></div></main><div th:replace="~{fragments :: footer}"></div></body></html>
