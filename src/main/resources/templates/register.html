<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Account | Tours & Travels</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><div th:replace="~{fragments :: nav}"></div><main class="auth-layout"><div class="auth-photo"><span class="eyebrow">JOIN THE JOURNEY</span><h1>More places.<br><em>More memories.</em></h1><p>Create an account to keep your travel plans organized.</p></div><div class="auth-card"><div th:replace="~{fragments :: alerts}"></div><span class="eyebrow">CREATE YOUR ACCOUNT</span><h2>Start your <em>story.</em></h2><form th:action="@{/register}" method="post" class="form-stack"><label>Full name<input name="fullName" required maxlength="100" placeholder="Your full name"></label><label>Email address<input name="email" type="email" required placeholder="you@example.com"></label><label>Password<input name="password" type="password" minlength="8" required autocomplete="new-password" placeholder="At least 8 characters"></label><label>Confirm password<input name="confirmPassword" type="password" minlength="8" required autocomplete="new-password" placeholder="Enter password again"></label><button class="btn btn-gold btn-full">Create account ↗</button></form><p class="auth-switch">Already have an account? <a th:href="@{/login}">Sign in</a></p></div></main><div th:replace="~{fragments :: footer}"></div></body></html>
