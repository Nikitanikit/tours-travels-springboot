<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title th:text="${destination.name} + ' | Tours & Travels'">Destination</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><div th:replace="~{fragments :: nav}"></div><section class="detail-hero" th:style="|background-image:linear-gradient(90deg,rgba(8,35,58,.78),rgba(8,35,58,.08)),url('${destination.imageUrl}')|"><div class="detail-hero-content"><span class="eyebrow" th:text="${destination.country}">Country</span><h1 th:text="${destination.name}">Destination</h1><p th:text="${destination.description}">Description</p><a class="btn btn-gold" th:href="@{/packages}">Find a trip ↗</a></div></section><main class="section"><div class="section-heading"><div><span class="eyebrow">CURATED FOR YOU</span><h2>Trips around <em th:text="${destination.name}">this place</em></h2></div></div><div class="package-grid"><article class="package-card" th:each="p : ${packages}"><a class="package-image" th:href="@{/packages/{id}(id=${p.id})}"><img th:src="${p.imageUrl}" th:alt="${p.title}"><span class="pill" th:text="${p.category}">Category</span></a><div class="package-body"><h3 th:text="${p.title}">Title</h3><p th:text="${p.description}">Description</p><div class="price-row"><strong th:text="${'₹' + #numbers.formatDecimal(p.price,1,'COMMA',0,'POINT')}">₹0</strong><a class="round-arrow" th:href="@{/packages/{id}(id=${p.id})}">↗</a></div></div></article></div><div class="empty-state" th:if="${#lists.isEmpty(packages)}">We are preparing trips for this destination. <a th:href="@{/contact}">Ask our team</a>.</div></main><div th:replace="~{fragments :: footer}"></div></body></html>
