<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login | Tours & Travels</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><div th:replace="~{fragments :: nav}"></div><main class="auth-layout"><div class="auth-photo"><span class="eyebrow">WELCOME BACK</span><h1>Your next adventure<br><em>is waiting.</em></h1><p>Sign in to keep your travel plans close at hand.</p></div><div class="auth-card"><div th:replace="~{fragments :: alerts}"></div><span class="eyebrow">YOUR TRAVEL ACCOUNT</span><h2>Welcome <em>back.</em></h2><p>Sign in to view and manage your journeys.</p><div class="alert error" th:if="${param.error}">Email or password was incorrect. Please try again.</div><div class="alert success" th:if="${param.logout}">You have been signed out.</div><form th:action="@{/login}" method="post" class="form-stack"><label>Email address<input name="username" type="email" required autocomplete="username" placeholder="you@example.com"></label><label>Password<input name="password" type="password" required autocomplete="current-password" placeholder="Your password"></label><button class="btn btn-gold btn-full">Sign in ↗</button></form><p class="auth-switch">New here? <a th:href="@{/register}">Create an account</a></p></div></main><div th:replace="~{fragments :: footer}"></div></body></html>
