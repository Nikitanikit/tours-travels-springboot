services:
  - type: web
    name: tours-travels-springboot
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: render
      - key: ADMIN_EMAIL
        value: "tours&travels@gmail.com"
      - key: ADMIN_PASSWORD
        sync: false
